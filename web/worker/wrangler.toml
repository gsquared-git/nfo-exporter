name = "nfo-proxy"
main = "nfo-proxy.js"
compatibility_date = "2024-11-01"

# Restrict which page origins may call the proxy. Comma-separated, no spaces.
# Leave it out entirely to accept any origin — the host allowlist inside the
# Worker already limits what it can reach.
#
 [vars]
 ALLOWED_ORIGINS = "https://gsquared-git.github.io/"
